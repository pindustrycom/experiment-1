name: Strategy pots

# Four paper strategies, each with its own 1000 CAD pot (experiments/strategies; no orders placed anywhere):
#   long-term: trend following (ETFs), earnings drift, insider cluster buying; short-term: weekly reversal.
# Weekdays after the close: fetch prices (Yahoo), the S&P 500 list, earnings results and insider filings (Finnhub),
# move every pot to the close and form the next books, replay trend and reversal from 2019, and build the pages.
# The state and the price cache are saved to the "strategies-state" release (encrypted with state_crypt.sh, as the other
# experiments), and the pages as strategies-site.tar.gz, which pages.yml puts under /strategies/ and into the Markets dashboard.

on:
  pull_request:   # tests, plus a trial run on real data that saves nothing
    paths: ["experiments/strategies/**", ".github/workflows/strategies.yml"]
  schedule:
    - cron: "40 21 * * 1-5"   # 17:40 New York in summer, 16:40 in winter: after the close, before pages.yml (23:15)
  workflow_dispatch:

permissions:
  contents: write   # the state release

concurrency:
  group: strategies-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STATE_TAG: strategies-state
  TRIAL: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY || secrets.PASSWORD }}
      CRYPT: ${{ github.workspace }}/experiments/hub/state_crypt.sh
    defaults:
      run:
        working-directory: experiments/strategies
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/strategies/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: ruff check strats tests && python -m pytest -q

      - name: Restore the state
        run: |
          mkdir -p state
          if [ "$TRIAL" != "true" ] && gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx strategies-state.tar.gz; then
            # State exists: failing to restore it must stop the run, or a fresh state would restart every pot.
            gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern strategies-state.tar.gz --dir /tmp/prev
            "$CRYPT" open /tmp/prev/strategies-state.tar.gz
            tar xzf /tmp/prev/strategies-state.tar.gz -C state
            echo "Restored state from the previous run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous state: every pot starts at this close." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trade the close
        run: |
          set -o pipefail
          mkdir -p state/data
          python -m strats live --data state/data --state state/state.json --out site | tee /tmp/run.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("/tmp/run.json"))
          print(f"\n**Close {s['last_close']}**\n")
          for k, v in s["step"].items():
              print(f"- {k}: {v}")
          print(f"\nReplay: {json.dumps(s.get('replay'))[:600]}")
          print(f"\nPrices: {json.dumps(s.get('prices'))[:300]}; earnings: {s.get('earnings')}; insiders: {s.get('insiders')}")
          PY

      - name: Save the state and the pages
        if: env.TRIAL != 'true'
        run: |
          [ -f site/index.html ] || { echo "No pages were built."; exit 1; }
          mkdir -p /tmp/out
          tar czf /tmp/out/strategies-state.tar.gz -C state .
          tar czf /tmp/out/strategies-site.tar.gz -C site .
          "$CRYPT" seal /tmp/out/*.tar.gz
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --title "Strategy pots state" --latest=false \
              --notes "State (books, events, price cache) and pages of the four strategy pots. Not a software release."
          gh release upload "$STATE_TAG" /tmp/out/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
