name: Experiment 2

# Experiment 2 (the volatility-timed portfolio from exp2/collapse.py, tracked on paper; exp2/live.py):
#   morning, before the US open: predict the day's portfolio return and its 68% band from data up to the last close;
#   evening, after the close: score the morning's prediction, log the error, and update what the model learns from it.
# Its state (prices, monthly books, prediction log) and its pages are saved to the "exp2-state" release, and each run
# asks the dashboard workflow (pages.yml) to republish the site, so the morning prediction is on the site before the open.
# The prediction log is also committed to the "exp2-ledger" branch (live/predictions.csv), so each prediction's
# timestamp is on record in git before its outcome is known.
# The release files are encrypted with experiments/hub/state_crypt.sh (STATE_KEY, or the site PASSWORD), as in pages.yml.
# The earlier tech-sector model (python -m exp2 run) is kept in the code but no longer scheduled.

on:
  pull_request:   # tests, plus a trial run on real data that saves nothing
    paths: ["experiments/exp2_sector_ssm/**", "experiments/hub/**", ".github/workflows/exp2.yml"]
  schedule:
    - cron: "0 13 * * 1-5"    # morning: 9:00 New York in summer, 8:00 in winter
    - cron: "0 22 * * 1-5"    # evening: 18:00 New York in summer, 17:00 in winter
  workflow_dispatch:
    inputs:
      mode:
        description: "morning (predict today) or evening (score today)"
        type: choice
        options: [morning, evening]
        default: evening

permissions:
  contents: write   # release assets and the ledger branch
  actions: write    # ask pages.yml to republish

concurrency:
  group: exp2-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STATE_TAG: exp2-state
  STATE_FILE: exp2-live-state.tar.gz

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY || secrets.PASSWORD }}
      CRYPT: ${{ github.workspace }}/experiments/hub/state_crypt.sh
      TRIAL: ${{ github.event_name == 'pull_request' }}
      MODE: ${{ inputs.mode || (github.event.schedule == '0 13 * * 1-5' && 'morning') || 'evening' }}
    defaults:
      run:
        working-directory: experiments/exp2_sector_ssm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/exp2_sector_ssm/requirements.txt
      - run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Tests
        run: ruff check exp2 tests && python -m pytest -q && python -m pytest -q ../hub

      - name: Check the OpenBB fallback against Yahoo (VIX, T-bills)
        if: env.TRIAL == 'true'
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from exp2 import openbb_src, papers
          print("\n| Series | OpenBB source | OpenBB last | Yahoo last | Median gap | Within tolerance |\n|---|---|---|---|---|---|")
          for t in openbb_src.SOURCES:
              try:
                  o = openbb_src.fetch(t, "2019-01-01")
              except Exception as e:
                  print(f"| {t} | {openbb_src.SOURCES[t]} | failed: {type(e).__name__}: {str(e)[:120]} | | | no |")
                  continue
              try:
                  y = papers.fetch_yahoo(t, "2019-01-01")
                  g = openbb_src.gap(t, y, o)
                  ylast, ok = f"{y['date'].iloc[-1]} {y['close'].iloc[-1]:.2f}", openbb_src.agrees(t, y, o)
              except Exception as e:
                  ylast, g, ok = f"failed: {type(e).__name__}", None, "n/a"
              unit = "%" if openbb_src.TOLERANCE[t][0] == "rel" else " pts"
              gs = "" if g is None else (f"{g:.2%}" if unit == "%" else f"{g:.3f}{unit}")
              print(f"| {t} | {openbb_src.SOURCES[t]} | {o['date'].iloc[-1]} {o['close'].iloc[-1]:.2f} ({len(o)} days) | {ylast} | {gs} | {ok} |")
          PY

      - name: Restore state from the last run
        run: |
          mkdir -p state
          if [ "$TRIAL" != "true" ] && gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$STATE_FILE"; then
            # State exists: failing to restore it must stop the run, or a fresh state would overwrite the log.
            gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$STATE_FILE" --dir /tmp/prev
            "$CRYPT" open "/tmp/prev/$STATE_FILE"
            tar xzf "/tmp/prev/$STATE_FILE" -C state
            echo "Restored state from the previous run." >> "$GITHUB_STEP_SUMMARY"
          else
            # First run (or a trial): start from the research price cache and replay 2019 to today.
            mkdir -p state/data
            gh release download papers-data --repo "$GITHUB_REPOSITORY" --pattern papers-data.tar.gz --dir /tmp/seed
            tar xzf /tmp/seed/papers-data.tar.gz -C state/data
            echo "No previous state: seeded prices from the papers-data release; the log is replayed from 2019." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Experiment 2 (${{ env.MODE }})
        run: |
          set -o pipefail
          python -m exp2 live --mode "$MODE" --state state --site site | tee /tmp/run.json
          if [ "$TRIAL" = "true" ]; then   # a trial also exercises the other half of the day
            other=$([ "$MODE" = morning ] && echo evening || echo morning)
            python -m exp2 live --mode "$other" --state state --site site --no-network | tee /tmp/run2.json
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("/tmp/run.json"))
          f = s.get("fetch") or {}
          print(f"\n**{s['mode']} run for {s['ny_date']}** (last close {s['last_close']}, {s['seconds']} s); "
                f"replayed or caught up {s.get('backfilled_days', 0)} sessions; fetch: {json.dumps({k: v for k, v in f.items() if k != 'failed'})[:300]}")
          p = (s.get("prediction") or {})
          if p.get("row"):
              r = p["row"]
              print(f"\n**Prediction for {r['date']}:** {r['exp_ret']:+.3f}% (68% band {r['band_lo']:+.2f}% to {r['band_hi']:+.2f}%), chance up {r['p_up']:.0%}")
          elif p:
              print(f"\nNo prediction: {p.get('skipped')}")
          if s.get("scored") is not None:
              print(f"\nScored: {s['scored'] or 'nothing pending'}")
          PY

      - name: Keep the trial run's pages for inspection
        if: env.TRIAL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exp2-trial-site
          path: experiments/exp2_sector_ssm/site

      - name: Save state and pages
        if: env.TRIAL != 'true'
        run: |
          [ -f site/index.html ] || { echo "No pages were built."; exit 1; }
          mkdir -p /tmp/out
          tar czf "/tmp/out/$STATE_FILE" -C state .
          tar czf /tmp/out/exp2-site.tar.gz -C site .
          tar czf "/tmp/out/exp2-live-log-$(date -u +%Y%m%d).tar.gz" -C state log
          "$CRYPT" seal /tmp/out/*.tar.gz
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --title "Experiment 2 state" --latest=false \
              --notes "Experiment 2's data, monthly books, prediction log and pages. $STATE_FILE is restored at the start of each run; dated copies of the log are kept for 30 days."
          gh release upload "$STATE_TAG" /tmp/out/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            d=${name#exp2-live-log-}; d=${d%.tar.gz}
            if [[ $d =~ ^[0-9]{8}$ ]] && [ "$d" -lt "$cutoff" ]; then gh release delete-asset "$STATE_TAG" "$name" --repo "$GITHUB_REPOSITORY" -y; fi
          done
          echo "Saved state: $(du -h "/tmp/out/$STATE_FILE" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the log in git
        if: env.TRIAL != 'true'
        run: |
          [ -f state/log/predictions.csv ] || exit 0
          src="$PWD/state/log/predictions.csv"
          dir=$(mktemp -d) && cd "$dir" && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin exp2-ledger 2>/dev/null; then git checkout -q -b exp2-ledger FETCH_HEAD; else git checkout -q --orphan exp2-ledger; fi
          mkdir -p live && cp "$src" live/predictions.csv
          git add live/predictions.csv
          if git diff --cached --quiet; then echo "Log unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Experiment 2 $MODE log, $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin exp2-ledger

      - name: Republish the site
        if: env.TRIAL != 'true'
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" -f publish_only=true
