name: Experiment 2

# Experiment 2 (tech sector state-space model): after each US market close, update prices and news,
# score due predictions, retrain weekly, make tonight's prediction and build its pages.
# It does not deploy anything itself: its state and its pages are saved to the "exp2-state" release,
# and the dashboard workflow (pages.yml) picks the pages up when it publishes the whole site.
# The prediction ledger is also committed to the "exp2-ledger" branch, so each prediction's
# timestamp is on record in git before its outcome is known.
#
# Uses the same secrets as the dashboard: TIINGO_API_KEY, FINNHUB_API_KEY, ANTHROPIC_API_KEY.

on:
  pull_request:   # tests, plus a trial run on real data that saves nothing
    paths: ["experiments/**", ".github/workflows/exp2.yml"]
  schedule:
    - cron: "40 22 * * 1-5"   # 18:40 New York in summer, 17:40 in winter; ahead of the dashboard run at 23:15
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the walk-forward backtest"
        type: boolean
        default: false
      retrain:
        description: "Retrain the model even if it is current"
        type: boolean
        default: false

permissions:
  contents: write   # release assets and the ledger branch

concurrency:
  group: exp2-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STATE_TAG: exp2-state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TRIAL: ${{ github.event_name == 'pull_request' }}
      # A pull request's trial run backfills less news and spends at most $0.50 on scoring it.
      EXP2_NEWS_BACKFILL_DAYS: ${{ github.event_name == 'pull_request' && '30' || '365' }}
      EXP2_CLAUDE_BUDGET_USD: ${{ github.event_name == 'pull_request' && '0.5' || '5' }}
    defaults:
      run:
        working-directory: experiments/exp2_sector_ssm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/exp2_sector_ssm/requirements.txt
      - run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Tests
        run: ruff check exp2 tests && python -m pytest -q && python -m pytest -q ../hub

      - name: Restore state from the last run
        run: |
          mkdir -p state
          if gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx exp2-state.tar.gz; then
            # State exists: failing to restore it must stop the run, or a fresh state would overwrite the ledger.
            gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern exp2-state.tar.gz --dir /tmp/prev
            tar xzf /tmp/prev/exp2-state.tar.gz -C state
            echo "Restored state from the previous run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous state: first run (backfills a year of news and runs the backtest)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Experiment 2
        run: |
          args=""
          [ "${{ inputs.backtest }}" = "true" ] && args="$args --backtest"
          [ "${{ inputs.retrain }}" = "true" ] && args="$args --retrain"
          python -m exp2 run --state state --site site $args | tee /tmp/run.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("/tmp/run.json"))
          print("\n| Step | Result |\n|---|---|")
          for k, v in s["steps"].items():
              extra = {a: b for a, b in v.items() if a not in ("status",)}
              print(f"| {k} | {v['status']} {json.dumps(extra)[:300].replace('|', '/')} |")
          for w in s["warnings"]:
              print(f"\n> {w}")
          l = s.get("latest") or {}
          for r in l.get("rows", []):
              if r["model"] == "ssm":
                  print(f"\n**{r['target']} as of {l['as_of']}:** {r['pred']:+.3f} (sd {r['sd']:.3f}, P(up) {r['p_up']:.2f})")
          PY

      - name: Keep the trial run's pages for inspection
        if: env.TRIAL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: exp2-trial-site
          path: experiments/exp2_sector_ssm/site

      - name: Save state and pages
        if: env.TRIAL != 'true'
        run: |
          [ -d site ] || { echo "No pages were built."; exit 1; }
          mkdir -p /tmp/out
          tar czf /tmp/out/exp2-state.tar.gz -C state .
          tar czf /tmp/out/exp2-site.tar.gz -C site .
          cp /tmp/out/exp2-state.tar.gz "/tmp/out/exp2-state-$(date -u +%Y%m%d).tar.gz"
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --title "Experiment 2 state" --latest=false \
              --notes "Experiment 2's data, model and pages. exp2-state.tar.gz is restored at the start of each run; dated copies are kept for 30 days."
          gh release upload "$STATE_TAG" /tmp/out/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            d=${name#exp2-state-}; d=${d%.tar.gz}
            if [[ $d =~ ^[0-9]{8}$ ]] && [ "$d" -lt "$cutoff" ]; then gh release delete-asset "$STATE_TAG" "$name" --repo "$GITHUB_REPOSITORY" -y; fi
          done
          echo "Saved state: $(du -h /tmp/out/exp2-state.tar.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the ledger in git
        if: env.TRIAL != 'true'
        run: |
          [ -f state/ledger/predictions.csv ] || exit 0
          src="$PWD/state/ledger/predictions.csv"
          dir=$(mktemp -d) && cd "$dir" && git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin exp2-ledger 2>/dev/null; then git checkout -q -b exp2-ledger FETCH_HEAD; else git checkout -q --orphan exp2-ledger; fi
          cp "$src" predictions.csv
          git add predictions.csv
          if git diff --cached --quiet; then echo "Ledger unchanged."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Experiment 2 ledger, $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin exp2-ledger
