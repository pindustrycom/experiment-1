name: Experiment 2 topological arb

# Paper backtest of a topological stat arb on 50 large US stocks (experiments/exp2_sector_ssm/exp2/topo.py):
# correlation graph, Laplacian residual reversal, persistent-homology exposure gate, against plain
# reversal, PCA residual reversal and SPY. Prices are cached in the "exp2-topo-data" release together with
# the latest results. Nothing is deployed and nothing is traded.

on:
  pull_request:
    paths: ["experiments/exp2_sector_ssm/exp2/topo.py", "experiments/exp2_sector_ssm/exp2/oria.py", "experiments/exp2_sector_ssm/tests/test_oria.py", "experiments/exp2_sector_ssm/tests/test_topo.py", ".github/workflows/exp2-topo.yml"]
  workflow_dispatch:

permissions:
  contents: write   # the data cache release

concurrency:
  group: exp2-topo
  cancel-in-progress: true

env:
  DATA_TAG: exp2-topo-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: experiments/exp2_sector_ssm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/exp2_sector_ssm/requirements.txt
      - run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Tests
        run: ruff check exp2 tests && python -m pytest -q tests/test_topo.py tests/test_oria.py

      - name: Restore cached prices
        run: |
          mkdir -p topo_data
          if gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx topo-data.tar.gz; then
            gh release download "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --pattern topo-data.tar.gz --dir /tmp/prev
            tar xzf /tmp/prev/topo-data.tar.gz -C topo_data
          fi

      - name: Backtest
        run: |
          set -o pipefail
          mkdir -p topo_results
          python -m exp2 topo --data topo_data --out topo_results | tee /tmp/run.json

      - name: ORIA ideas (next-open execution, heat kernel, ETF shocks, vol-managed SPY, orthogonal ensemble)
        run: |
          set -o pipefail
          python -m exp2 oria --data topo_data --out topo_results/oria | tee /tmp/oria.json

      - name: Save prices and results
        if: always()
        run: |
          gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --title "Experiment 2 topological arb data" \
              --notes "Cached prices and latest results for the topological stat arb backtest. Not a software release." --latest=false
          [ -d topo_data/prices ] && tar czf /tmp/topo-data.tar.gz -C topo_data . && gh release upload "$DATA_TAG" /tmp/topo-data.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          [ -d topo_results ] && tar czf /tmp/topo-results.tar.gz -C topo_results . && gh release upload "$DATA_TAG" /tmp/topo-results.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp2-topo-results
          path: experiments/exp2_sector_ssm/topo_results
          if-no-files-found: warn
