name: Update dashboard

# Runs the research pipeline after each US market close and publishes the read-only dashboard to
# GitHub Pages. The database lives only for the length of a run: it is restored from the latest
# dump in the "state" release, updated, dumped back, and the site is rebuilt from it.
#
# Optional repository secrets (Settings > Secrets and variables > Actions). Each one turns on a data source;
# anything missing shows as unavailable on the site, never as zero:
#   TIINGO_API_KEY, ANTHROPIC_API_KEY, FINNHUB_API_KEY, ALPHAVANTAGE_API_KEY
# Optional repository variable: SEC_USER_AGENT, e.g. "SplittabilityMonitor research you@example.com"
# (SEC requires a contact address; it enables filings and fundamentals).

on:
  schedule:
    - cron: "15 23 * * 1-5"   # 19:15 New York in summer, 18:15 in winter: after the close either way
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Re-run the walk-forward backtest"
        type: boolean
        default: false

permissions:
  contents: write   # upload the database dump to the "state" release
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  STATE_TAG: state

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
          POSTGRES_DB: sm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sm -d sm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sm:sm@localhost:5432/sm
      APP_MODE: production
      LOG_LEVEL: WARNING
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt && pip install -e . --no-deps

      - name: Session secret for this run only
        run: |
          key=$(openssl rand -hex 32); echo "::add-mask::$key"; echo "SECRET_KEY=$key" >> "$GITHUB_ENV"
          echo "PG=docker exec -i ${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: Restore the database from the last run
        run: |
          if gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern db-latest.dump --dir /tmp/state; then
            $PG pg_restore -U sm -d sm --no-owner --exit-on-error < /tmp/state/db-latest.dump
            echo "Restored the database from the previous run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous state found: starting a new database." >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m alembic upgrade head
          python -m app.cli init

      - name: Run the pipeline
        run: |
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for job in sync_reference ingest_prices ingest_fundamentals ingest_news compute_scores snapshot_predictions evaluate_outcomes; do
            out=$(python -m app.cli run-job "$job" 2>&1 || true)
            # run-job prints {"status": ..., "error": ..., "result": ...}; the result can be long and is cut off
          status=$(printf '%s' "$out" | python -c 'import re,sys
          s=sys.stdin.read(); m=re.search(r"^\{\s*\"status\": \"(\w+)\",\s*\"error\": (null|\"(?:[^\"\\]|\\.)*\")", s, re.M)
          print("crashed" if not m else m.group(1) + ("" if m.group(2) == "null" else ": " + m.group(2)[1:-1][:200]))')
            echo "$job: $status"
            echo "| $job | ${status//|/ } |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$out" | grep -E '"level": "(WARNING|ERROR)"' | head -3 || true
            if [ "$status" = "crashed" ]; then printf '%s\n' "$out" | tail -30; fi
          done
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from sqlalchemy import func, select
          from app.core.db import session_scope
          from app.models import PriceObservation
          with session_scope() as db:
              rows = db.execute(select(PriceObservation.provider, func.count(), func.count(func.distinct(PriceObservation.company_id)), func.max(PriceObservation.date))
                                .group_by(PriceObservation.provider)).all()
          print("\n**Prices stored:** " + ("; ".join(f"{p}: {n} rows for {c} tickers, last {d}" for p, n, c, d in rows) or "none"))
          PY

      - name: Rebuild past score history (weekly; continues where the last run stopped)
        run: |
          out=$(python -m app.cli run-job backfill_scores --params '{"max_seconds": 2400}' 2>&1 || true)
          printf '%s\n' "$out" | grep -oE '"(status|weeks|scored|skipped|errors|complete)": [^,}]+' | tr '\n' ' ' | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out" | grep -A6 '"first_errors"' | head -8 || true

      - name: Walk-forward backtest (until one has data, or on request)
        run: |
          has=$(python -c 'from sqlalchemy import select, func
          from app.core.db import session_scope
          from app.models import BacktestRun
          with session_scope() as db:
              runs = db.scalars(select(BacktestRun).where(BacktestRun.kind=="walk_forward", BacktestRun.is_demo.is_(False))).all()
              print(sum(1 for r in runs if (r.metrics or {}).get("n_observations")))' 2>/dev/null || echo 0)
          if [ "${{ inputs.run_backtest }}" = "true" ] || [ "$has" = "0" ]; then
            python -m app.cli run-job run_backtest | head -c 2000 || true
          fi

      - name: Build the site
        run: python -m app.static_site --out "$GITHUB_WORKSPACE/_site"

      - name: Save the database for the next run
        run: |
          mkdir -p /tmp/out
          $PG pg_dump -U sm -d sm -Fc --no-owner > /tmp/out/db-latest.dump
          cp /tmp/out/db-latest.dump "/tmp/out/db-$(date -u +%Y%m%d).dump"
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --title "Dashboard database" --latest=false \
              --notes "Database dumps used by the dashboard workflow. db-latest.dump is restored at the start of each run; dated copies are kept for 30 days."
          gh release upload "$STATE_TAG" /tmp/out/*.dump --repo "$GITHUB_REPOSITORY" --clobber
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            d=${name#db-}; d=${d%.dump}
            if [[ $d =~ ^[0-9]{8}$ ]] && [ "$d" -lt "$cutoff" ]; then gh release delete-asset "$STATE_TAG" "$name" --repo "$GITHUB_REPOSITORY" -y; fi
          done
          echo "Saved database: $(du -h /tmp/out/db-latest.dump | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
