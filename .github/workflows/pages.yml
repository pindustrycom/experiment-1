name: Update dashboard

# Runs the research pipeline after each US market close and publishes the read-only dashboard to
# GitHub Pages. The site root is the combined 1000 CAD paper portfolio (experiments/hub/portfolio.py); Experiment 1 (this pipeline) is under /exp1/ and
# Experiment 2 (built by exp2.yml) under /exp2/,
# Experiment 7 (built by exp7.yml) under /exp7/, the strategy pots and the Quant lab (strategies.yml) under /strategies/ and /quant/. The database lives only for the length of a run: it is restored from the latest
# dump in the "state" release, updated, dumped back, and the site is rebuilt from it.
# Experiment 2 runs twice a day and then asks for a publish-only run, which skips the pipeline and reuses Experiment 1's
# pages from the last full run (saved as exp1-site.tar.gz in the "state" release).
#
# Optional repository secrets (Settings > Secrets and variables > Actions). Each one turns on a data source;
# anything missing shows as unavailable on the site, never as zero:
#   TIINGO_API_KEY, ANTHROPIC_API_KEY, FINNHUB_API_KEY, ALPHAVANTAGE_API_KEY
# Optional repository variable: SEC_USER_AGENT, e.g. "SplittabilityMonitor research you@example.com"
# (SEC requires a contact address; it enables filings and fundamentals).
#
# Required secret PASSWORD: the whole site is encrypted with it (experiments/hub/lock_site.py) and visitors
# unlock it in the browser. Without it nothing is published and the last deployed site stays up.
# The releases are public like the repository, so every file this workflow keeps there (database dumps, Experiment 1's
# pages, the paper portfolio) is encrypted with experiments/hub/state_crypt.sh under the STATE_KEY secret, or under
# PASSWORD when STATE_KEY is not set. Set STATE_KEY before ever changing PASSWORD, or the saved state can't be read.

on:
  schedule:
    - cron: "15 23 * * 1-5"   # 19:15 New York in summer, 18:15 in winter: after the close either way
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Re-run the walk-forward backtest"
        type: boolean
        default: false
      publish_only:
        description: "Only republish: reuse Experiment 1's last pages and pick up Experiment 2's latest (exp2.yml sets this)"
        type: boolean
        default: false

permissions:
  contents: write   # upload the database dump to the "state" release
  pages: write
  id-token: write

concurrency:
  group: dashboard-${{ inputs.publish_only && 'publish' || 'full' }}
  cancel-in-progress: false

env:
  STATE_TAG: state

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
          POSTGRES_DB: sm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sm -d sm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sm:sm@localhost:5432/sm
      APP_MODE: production
      LOG_LEVEL: WARNING
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY || secrets.PASSWORD }}
      CRYPT: ${{ github.workspace }}/experiments/hub/state_crypt.sh
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt && pip install -e . --no-deps
        if: ${{ !inputs.publish_only }}

      - name: Session secret for this run only
        run: |
          key=$(openssl rand -hex 32); echo "::add-mask::$key"; echo "SECRET_KEY=$key" >> "$GITHUB_ENV"
          echo "PG=docker exec -i ${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: Restore the database from the last run
        if: ${{ !inputs.publish_only }}
        run: |
          if gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern db-latest.dump --dir /tmp/state; then
            "$CRYPT" open /tmp/state/db-latest.dump
            $PG pg_restore -U sm -d sm --no-owner --exit-on-error < /tmp/state/db-latest.dump
            echo "Restored the database from the previous run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous state found: starting a new database." >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m alembic upgrade head
          python -m app.cli init

      - name: Run the pipeline
        if: ${{ !inputs.publish_only }}
        run: |
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for job in sync_reference ingest_prices ingest_fundamentals ingest_news compute_scores snapshot_predictions evaluate_outcomes; do
            out=$(python -m app.cli run-job "$job" 2>&1 || true)
            # run-job prints {"status": ..., "error": ..., "result": ...}; the result can be long and is cut off
          status=$(printf '%s' "$out" | python -c 'import re,sys
          s=sys.stdin.read(); m=re.search(r"^\{\s*\"status\": \"(\w+)\",\s*\"error\": (null|\"(?:[^\"\\]|\\.)*\")", s, re.M)
          print("crashed" if not m else m.group(1) + ("" if m.group(2) == "null" else ": " + m.group(2)[1:-1][:200]))')
            echo "$job: $status"
            echo "| $job | ${status//|/ } |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$out" | grep -E '"level": "(WARNING|ERROR)"' | head -3 || true
            if [ "$status" = "crashed" ]; then printf '%s\n' "$out" | tail -30; fi
          done
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from sqlalchemy import func, select
          from app.core.db import session_scope
          from app.models import PriceObservation
          with session_scope() as db:
              rows = db.execute(select(PriceObservation.provider, func.count(), func.count(func.distinct(PriceObservation.company_id)), func.max(PriceObservation.date))
                                .group_by(PriceObservation.provider)).all()
          print("\n**Prices stored:** " + ("; ".join(f"{p}: {n} rows for {c} tickers, last {d}" for p, n, c, d in rows) or "none"))
          PY

      - name: Data check (news, Claude usage, latest scores)
        if: ${{ !inputs.publish_only }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          from datetime import UTC, datetime, timedelta
          from sqlalchemy import func, select
          from app.core.db import session_scope
          import json
          from app.models import CompanyFundamental, ComponentCalculation, ExtractedEvent, IndexScore, NewsArticle, NewsFetchLog, Pair, ProviderUsage
          with session_scope() as db:
              since = datetime.now(UTC) - timedelta(hours=6)
              fetch = db.execute(select(NewsFetchLog.provider, NewsFetchLog.success, func.count(), func.sum(NewsFetchLog.documents_found))
                                 .where(NewsFetchLog.window_end >= since).group_by(NewsFetchLog.provider, NewsFetchLog.success)).all()
              print("\n**News fetches this run:** " + ("; ".join(f"{p} {'ok' if ok else 'failed'} x{n} ({d or 0} docs)" for p, ok, n, d in fetch) or "none"))
              err = db.scalar(select(NewsFetchLog.error).where(NewsFetchLog.window_end >= since, NewsFetchLog.success.is_(False)).limit(1))
              if err:
                  print(f"\nFirst fetch error: {err[:300]}")
              st = db.execute(select(NewsArticle.analysis_status, func.count()).group_by(NewsArticle.analysis_status)).all()
              print("\n**Stories by analysis status:** " + ("; ".join(f"{a}: {n}" for a, n in st) or "none"))
              aerr = db.scalar(select(NewsArticle.analysis_error).where(NewsArticle.analysis_error.is_not(None)).limit(1))
              if aerr:
                  print(f"\nFirst analysis error: {aerr[:300]}")
              ev = db.execute(select(ExtractedEvent.is_material, func.count()).group_by(ExtractedEvent.is_material)).all()
              print("\n**Extracted events (material/not):** " + ("; ".join(f"{m}: {n}" for m, n in ev) or "none"))
              use = db.execute(select(ProviderUsage.provider, func.count(), func.sum(ProviderUsage.cost_usd))
                               .where(ProviderUsage.ts >= since).group_by(ProviderUsage.provider)).all()
              print("\n**Provider calls this run:** " + ("; ".join(f"{p}: {n} calls, ${c or 0:.3f}" for p, n, c in use) or "none"))
              fdiag = []
              print("\n| Pair | SI-v1 | SI-v2 | SI-v2 status | coverage | why |\n|---|---|---|---|---|---|")
              for pr in db.scalars(select(Pair).where(Pair.status == "active").order_by(Pair.slug)):
                  last = {}
                  for name in ("si_v1", "si_v2"):
                      last[name] = db.scalar(select(IndexScore).where(IndexScore.pair_id == pr.id, IndexScore.index_name == name)
                                             .order_by(IndexScore.as_of.desc(), IndexScore.id.desc()).limit(1))
                  v1, v2 = last["si_v1"], last["si_v2"]
                  f = lambda x: "n/a" if x is None or x.value is None else f"{x.value:.1f}"
                  why = "" if v2 is None else " ".join(v2.explanation.split())[:220].replace("|", "/")
                  print(f"| {pr.slug} | {f(v1)} | {f(v2)} | {v2.status if v2 else '-'} | {v2.coverage if v2 else 0:.2f} | {why} |")
                  if v2 is not None:
                      fc = db.scalar(select(ComponentCalculation).where(ComponentCalculation.score_id == v2.id, ComponentCalculation.component == "F"))
                      if fc is not None and not fc.available:
                          fdiag.append((pr, fc))
              for pr, fc in fdiag:  # why fundamentals are missing, with the latest SEC facts on file
                  print(f"\n**{pr.slug} fundamentals:** {fc.explanation} inputs: {json.dumps(fc.inputs, default=str)[:600]}")
                  for c in (pr.company_a, pr.company_b):
                      for m in ("revenue", "operating_income", "eps_diluted"):
                          r = db.execute(select(CompanyFundamental.period_end, CompanyFundamental.duration_days, CompanyFundamental.filed_at, CompanyFundamental.form)
                                         .where(CompanyFundamental.company_id == c.id, CompanyFundamental.metric == m)
                                         .order_by(CompanyFundamental.period_end.desc(), CompanyFundamental.filed_at.desc()).limit(3)).all()
                          n = db.scalar(select(func.count()).select_from(CompanyFundamental).where(CompanyFundamental.company_id == c.id, CompanyFundamental.metric == m))
                          print(f"- {c.ticker} {m}: {n} facts; latest {[tuple(map(str, x)) for x in r]}")
          PY

      - name: Rebuild past score history (weekly; continues where the last run stopped)
        if: ${{ !inputs.publish_only }}
        run: |
          out=$(python -m app.cli run-job backfill_scores --params '{"max_seconds": 2400}' 2>&1 || true)
          printf '%s\n' "$out" | grep -oE '"(status|weeks|scored|skipped|errors|complete)": [^,}]+' | tr '\n' ' ' | tee -a "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out" | grep -A6 '"first_errors"' | head -8 || true

      - name: Walk-forward backtest (until one has data, or on request)
        if: ${{ !inputs.publish_only }}
        run: |
          has=$(python -c 'from sqlalchemy import select, func
          from app.core.db import session_scope
          from app.models import BacktestRun
          with session_scope() as db:
              runs = db.scalars(select(BacktestRun).where(BacktestRun.kind=="walk_forward", BacktestRun.is_demo.is_(False))).all()
              print(sum(1 for r in runs if (r.metrics or {}).get("n_observations")))' 2>/dev/null || echo 0)
          if [ "${{ inputs.run_backtest }}" = "true" ] || [ "$has" = "0" ]; then
            python -m app.cli run-job run_backtest | head -c 2000 || true
          fi

      - name: Build the site
        if: ${{ !inputs.publish_only }}
        run: |
          python -m app.static_site --out "$GITHUB_WORKSPACE/_site/exp1"
          tar czf /tmp/exp1-site.tar.gz -C "$GITHUB_WORKSPACE/_site/exp1" .
          "$CRYPT" seal /tmp/exp1-site.tar.gz
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
            gh release upload "$STATE_TAG" /tmp/exp1-site.tar.gz --repo "$GITHUB_REPOSITORY" --clobber || true

      - name: Reuse Experiment 1's pages from the last full run
        if: ${{ inputs.publish_only }}
        working-directory: ${{ github.workspace }}
        run: |
          # Never publish a site without Experiment 1: if its pages were never saved, stop here.
          gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern exp1-site.tar.gz --dir /tmp/exp1
          "$CRYPT" open /tmp/exp1/exp1-site.tar.gz
          mkdir -p _site/exp1 && tar xzf /tmp/exp1/exp1-site.tar.gz -C _site/exp1

      - name: Add Experiment 2 and the paper portfolio
        working-directory: ${{ github.workspace }}
        run: |
          # Experiment 2 runs in its own workflow (exp2.yml) and saves its pages to the "exp2-state" release.
          mkdir -p _site/exp2
          if gh release download exp2-state --repo "$GITHUB_REPOSITORY" --pattern exp2-site.tar.gz --dir /tmp/exp2 2>/dev/null; then
            "$CRYPT" open /tmp/exp2/exp2-site.tar.gz
            tar xzf /tmp/exp2/exp2-site.tar.gz -C _site/exp2
          else
            echo "Experiment 2 has no pages yet; the hub shows it as not published." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Experiment 7 (exp7.yml, after each close) saves its pages to the "exp7-state" release.
          if gh release download exp7-state --repo "$GITHUB_REPOSITORY" --pattern exp7-site.tar.gz --dir /tmp/exp7 2>/dev/null; then
            "$CRYPT" open /tmp/exp7/exp7-site.tar.gz
            mkdir -p _site/exp7 && tar xzf /tmp/exp7/exp7-site.tar.gz -C _site/exp7
          fi
          # The paper portfolios (experiments/hub/portfolio.py): Experiment 1's daily books are kept in the "portfolio-state"
          # release. Only the full run moves them forward and saves them; a publish-only run just re-reads them.
          if gh release download strategies-state --repo "$GITHUB_REPOSITORY" --pattern strategies-site.tar.gz --dir /tmp/strats 2>/dev/null; then
            "$CRYPT" open /tmp/strats/strategies-site.tar.gz
            mkdir -p _site/strategies && tar xzf /tmp/strats/strategies-site.tar.gz -C _site/strategies
          fi
          # The Quant lab (strats/quant.py, run by strategies.yml) is kept in the same release.
          if gh release download strategies-state --repo "$GITHUB_REPOSITORY" --pattern quant-site.tar.gz --dir /tmp/quant 2>/dev/null; then
            "$CRYPT" open /tmp/quant/quant-site.tar.gz
            mkdir -p _site/quant && tar xzf /tmp/quant/quant-site.tar.gz -C _site/quant
          fi
          mkdir -p /tmp/pf
          if gh release view portfolio-state --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx portfolio.json; then
            gh release download portfolio-state --repo "$GITHUB_REPOSITORY" --pattern portfolio.json --dir /tmp/pf
            "$CRYPT" open /tmp/pf/portfolio.json
          fi
          python experiments/hub/build_hub.py --site _site --state /tmp/pf/portfolio.json ${{ !inputs.publish_only && '--update' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.publish_only }}" != "true" ]; then
            gh release view portfolio-state --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create portfolio-state --repo "$GITHUB_REPOSITORY" --title "Paper portfolio state" --latest=false \
                --notes "Experiment 1's daily paper books and USD/CAD rates for the 1000 CAD paper portfolios. Updated by each nightly run."
            mkdir -p /tmp/pf-out && cp /tmp/pf/portfolio.json /tmp/pf-out/ && "$CRYPT" seal /tmp/pf-out/portfolio.json
            gh release upload portfolio-state /tmp/pf-out/portfolio.json --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Save the database for the next run
        if: ${{ !inputs.publish_only }}
        run: |
          mkdir -p /tmp/out
          $PG pg_dump -U sm -d sm -Fc --no-owner > /tmp/out/db-latest.dump
          cp /tmp/out/db-latest.dump "/tmp/out/db-$(date -u +%Y%m%d).dump"
          "$CRYPT" seal /tmp/out/*.dump
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --title "Dashboard database" --latest=false \
              --notes "Database dumps used by the dashboard workflow. db-latest.dump is restored at the start of each run; dated copies are kept for 30 days."
          gh release upload "$STATE_TAG" /tmp/out/*.dump --repo "$GITHUB_REPOSITORY" --clobber
          cutoff=$(date -u -d '30 days ago' +%Y%m%d)
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            d=${name#db-}; d=${d%.dump}
            if [[ $d =~ ^[0-9]{8}$ ]] && [ "$d" -lt "$cutoff" ]; then gh release delete-asset "$STATE_TAG" "$name" --repo "$GITHUB_REPOSITORY" -y; fi
          done
          echo "Saved database: $(du -h /tmp/out/db-latest.dump | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Lock the site with the password
        working-directory: ${{ github.workspace }}
        env:
          PASSWORD_SITE: ${{ secrets.PASSWORD }}
        run: |
          set -o pipefail   # a failed lock must stop the publish, not be hidden by tee
          pip install cryptography==50.0.1
          python experiments/hub/lock_site.py --site _site | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
