name: Oracle day (research)

# Paper research only (research/oracle_day): fetch one day's Tiingo IEX 1-minute bars for a ticker list and compute the
# perfect-hindsight "only the up-moves" result on $20. Bars and results go to the "oracle-day-data" release.

on:
  pull_request:
    paths: ["research/oracle_day/**", ".github/workflows/oracle-day.yml"]
  workflow_dispatch:
    inputs:
      day: {description: "YYYY-MM-DD", default: "2026-11-02"}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      DAY: ${{ inputs.day || '2026-11-02' }}
    defaults:
      run:
        working-directory: research/oracle_day
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pandas numpy requests
      - run: python fetch.py "$DAY" data "$(tr -d ' \n' < tickers.txt)"
      - run: python oracle.py data "$DAY" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to release
        run: |
          tar czf /tmp/oracle-day-$DAY.tar.gz data oracle_result.json oracle_table.csv
          gh release view oracle-day-data >/dev/null 2>&1 || gh release create oracle-day-data --latest=false --title "Oracle day (research data)" --notes "Paper research only."
          gh release upload oracle-day-data /tmp/oracle-day-$DAY.tar.gz oracle_result.json oracle_table.csv --clobber
