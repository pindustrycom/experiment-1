name: Experiment 2 paper ideas

# Paper backtests of three ideas from the literature (experiments/exp2_sector_ssm/exp2/papers.py): the variance risk
# premium, a Gu-Kelly-Xiu style machine-learning ranking of S&P 500 stocks, and overnight versus intraday momentum;
# then exp2/volpred.py: forecast each stock's volatility and use the forecast as an input for return prediction.
# Prices (Yahoo) and the S&P 500 membership list (Wikipedia) are cached in the "papers-data" release with the latest
# results. Nothing is deployed and nothing is traded.

on:
  pull_request:
    paths: ["experiments/exp2_sector_ssm/exp2/papers.py", "experiments/exp2_sector_ssm/exp2/volpred.py", "experiments/exp2_sector_ssm/tests/test_papers.py",
            "experiments/exp2_sector_ssm/tests/test_volpred.py", ".github/workflows/papers.yml"]
  workflow_dispatch:

permissions:
  contents: write   # the data cache release

concurrency:
  group: papers
  cancel-in-progress: true

env:
  DATA_TAG: papers-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: experiments/exp2_sector_ssm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/exp2_sector_ssm/requirements.txt
      - run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Tests
        run: ruff check exp2 tests && python -m pytest -q tests/test_papers.py tests/test_volpred.py

      - name: Restore cached data
        run: |
          mkdir -p papers_data
          if gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx papers-data.tar.gz; then
            gh release download "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --pattern papers-data.tar.gz --dir /tmp/prev
            tar xzf /tmp/prev/papers-data.tar.gz -C papers_data
          fi

      - name: Backtest
        run: |
          set -o pipefail
          python -m exp2 papers --data papers_data --out papers_results | tee /tmp/papers.json

      - name: Volatility forecast as an input (exp2/volpred.py)
        run: |
          set -o pipefail
          python -m exp2 volpred --data papers_data --out papers_results/volpred | tee /tmp/volpred.json

      - name: Save data and results
        if: always()
        run: |
          gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --title "Experiment 2 paper ideas data" \
              --notes "Cached prices, S&P 500 membership and latest results for the paper-idea backtests. Not a software release." --latest=false
          [ -d papers_data/prices ] && tar czf /tmp/papers-data.tar.gz -C papers_data . && gh release upload "$DATA_TAG" /tmp/papers-data.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          [ -d papers_results ] && tar czf /tmp/papers-results.tar.gz -C papers_results . && gh release upload "$DATA_TAG" /tmp/papers-results.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
