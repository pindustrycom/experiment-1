name: Experiment 7

# Experiment 7 (VWAP + 9 EMA cross, from an Instagram reel), paper only.
# - Backtest (pull requests, or workflow_dispatch with mode=backtest): fetch Tiingo IEX 1-minute bars for SPY and QQQ from
#   2019 and test the rule on 1, 3, 5 and 10-minute bars, year by year, with and without trading costs. results.json is
#   saved to the "exp7-state" release so the live page can show it.
# - Live (weekdays after the close, or mode=live): fetch this month's SPY bars, replay the day with the reel's rule
#   (3-minute bars, always in, 0.3 bp per side) and save the Exp7 pages as exp7-site.tar.gz in "exp7-state".
#   pages.yml puts them under /exp7/ and adds the 1000 CAD paper pot (experiments/hub/portfolio.py).
#
# Bars are cached in the "exp7-data" release, one file per ticker and month, so a rerun only fetches what is missing
# (Tiingo's hourly limit makes the first fill slow; a run that hits its time budget saves what it has and the next run
# carries on). Results are uploaded as the "exp7-results" artifact and printed in the log. Nothing is deployed.

on:
  pull_request:
    paths: ["experiments/exp7_vwap/**", ".github/workflows/exp7.yml"]
  schedule:
    - cron: "30 21 * * 1-5"   # 17:30 New York in summer, 16:30 in winter: after the close, before pages.yml (23:15)
  workflow_dispatch:
    inputs:
      mode:
        description: "backtest (refetch missing bars and rerun the grid) or live (today's paper trades and pages)"
        type: choice
        options: [live, backtest]
        default: live

permissions:
  contents: write   # the data cache release

concurrency:
  group: exp7
  cancel-in-progress: false

env:
  DATA_TAG: exp7-data
  STATE_TAG: exp7-state
  MODE: ${{ github.event_name == 'pull_request' && 'backtest' || github.event_name == 'schedule' && 'live' || inputs.mode }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      STATE_KEY: ${{ secrets.STATE_KEY || secrets.PASSWORD }}
      CRYPT: ${{ github.workspace }}/experiments/hub/state_crypt.sh
    defaults:
      run:
        working-directory: experiments/exp7_vwap
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/exp7_vwap/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: ruff check exp7 tests && python -m pytest -q

      - name: Restore cached bars
        run: |
          mkdir -p data
          if gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx exp7-data.tar.gz; then
            gh release download "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --pattern exp7-data.tar.gz --dir /tmp/prev
            tar xzf /tmp/prev/exp7-data.tar.gz -C data
            echo "Restored: $(find data -name '*.csv' | wc -l) ticker-months"
          fi

      - name: Fetch bars and backtest
        if: env.MODE == 'backtest'
        run: |
          set -o pipefail
          python -m exp7 backtest --data data --out results --tickers SPY,QQQ --start 2019-01 --minutes-budget 290 | tee /tmp/summary.txt

      - name: Fetch today's bars and replay the day
        run: |
          set -o pipefail
          mkdir -p /tmp/state
          if [ "$MODE" = backtest ]; then cp results/results.json /tmp/state/results.json; else
            gh release download "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern results.json --dir /tmp/state 2>/dev/null || true
            [ ! -f /tmp/state/results.json ] || "$CRYPT" open /tmp/state/results.json; fi
          [ "$MODE" = live ] || export TIINGO_API_KEY=""   # the backtest step already fetched
          python -m exp7 live --data data --out site --tickers SPY --start 2019-01 --minutes-budget 20 --results /tmp/state/results.json | tee /tmp/live.json

      - name: Save the pages (live) or the backtest results (backtest)
        run: |
          gh release view "$STATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$STATE_TAG" --repo "$GITHUB_REPOSITORY" --title "Experiment 7 state" --latest=false \
              --notes "Experiment 7's pages (exp7-site.tar.gz) and backtest results. Not a software release."
          if [ "$MODE" = live ]; then
            tar czf /tmp/exp7-site.tar.gz -C site . && "$CRYPT" seal /tmp/exp7-site.tar.gz
            gh release upload "$STATE_TAG" /tmp/exp7-site.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            mkdir -p /tmp/out && cp /tmp/state/results.json /tmp/out/ && "$CRYPT" seal /tmp/out/results.json
            gh release upload "$STATE_TAG" /tmp/out/results.json --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Save cached bars
        if: always()
        run: |
          [ -d data ] && [ -n "$(ls data)" ] || exit 0
          tar czf /tmp/exp7-data.tar.gz -C data .
          gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --title "Experiment 7 data cache" \
              --notes "Tiingo IEX 1-minute bars for Experiment 7. Not a software release." --latest=false
          gh release upload "$DATA_TAG" /tmp/exp7-data.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp7-results
          path: |
            experiments/exp7_vwap/results
            experiments/exp7_vwap/site
          if-no-files-found: warn
