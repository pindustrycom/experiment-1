name: Experiment 7

# Experiment 7 (VWAP + 9 EMA cross, from an Instagram reel): fetch Tiingo IEX 1-minute bars for SPY and QQQ from 2019,
# then backtest the rule on 1, 3, 5 and 10-minute bars, year by year, with and without trading costs.
#
# Bars are cached in the "exp7-data" release, one file per ticker and month, so a rerun only fetches what is missing
# (Tiingo's hourly limit makes the first fill slow; a run that hits its time budget saves what it has and the next run
# carries on). Results are uploaded as the "exp7-results" artifact and printed in the log. Nothing is deployed.

on:
  pull_request:
    paths: ["experiments/exp7_vwap/**", ".github/workflows/exp7.yml"]
  workflow_dispatch:

permissions:
  contents: write   # the data cache release

concurrency:
  group: exp7
  cancel-in-progress: false

env:
  DATA_TAG: exp7-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: experiments/exp7_vwap
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/exp7_vwap/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests
        run: ruff check exp7 tests && python -m pytest -q

      - name: Restore cached bars
        run: |
          mkdir -p data
          if gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx exp7-data.tar.gz; then
            gh release download "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --pattern exp7-data.tar.gz --dir /tmp/prev
            tar xzf /tmp/prev/exp7-data.tar.gz -C data
            echo "Restored: $(find data -name '*.csv' | wc -l) ticker-months"
          fi

      - name: Fetch bars and backtest
        run: |
          set -o pipefail
          python -m exp7 backtest --data data --out results --tickers SPY,QQQ --start 2019-01 --minutes-budget 290 | tee /tmp/summary.txt

      - name: Save cached bars
        if: always()
        run: |
          [ -d data ] && [ -n "$(ls data)" ] || exit 0
          tar czf /tmp/exp7-data.tar.gz -C data .
          gh release view "$DATA_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DATA_TAG" --repo "$GITHUB_REPOSITORY" --title "Experiment 7 data cache" \
              --notes "Tiingo IEX 1-minute bars for Experiment 7. Not a software release." --latest=false
          gh release upload "$DATA_TAG" /tmp/exp7-data.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp7-results
          path: experiments/exp7_vwap/results
          if-no-files-found: warn
