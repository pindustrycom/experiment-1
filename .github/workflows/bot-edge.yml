name: Bot edge test (5-minute crypto part)

# Research only, paper only (research/bot_edge). Runs freqtrade's own backtester, offline (ftrun.py supplies a fixed
# market table instead of calling an exchange), on Binance spot 5-minute bars from data.binance.vision (public, no key).
# The sandbox that did the rest of the study has only hourly crypto bars, so this job covers what needs 5-minute bars:
# freqtrade community strategies written for 5m/15m/30m, and NostalgiaForInfinity X7 (single pair and a 12-coin basket).
# No exchange keys, no live trading, nothing deployed. Trade exports go to the bot-edge-results release.

on:
  pull_request:
    paths: ["research/bot_edge/**", ".github/workflows/bot-edge.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-edge-${{ github.ref }}
  cancel-in-progress: true

env:
  FT_STRATS_SHA: f3340ce11f5bdf62f598522e64d1f5638eaa13f5   # freqtrade/freqtrade-strategies, 2026-09-08
  NFI_SHA: 3243cbe4350479f49e4edbeade4684d4dc78ae0b         # iterativv/NostalgiaForInfinity, 2026-11-17 (X7 v17.5.266)
  SSSSI_SHA: 3ed699f6773bd3db4526eb31bd6d459b95fd2bc2        # ssssi/freqtrade_strs, 2026-07-25
  NATE_SHA: 9bb7dab5df53203e69f60336749551a40767af0b         # nateemma/strategies, 2026-10-27
  # round 4 (2026-11-19, high-return claims): strategy collections, pinned
  THEO_SHA: c9def379b1036064d592c3a0518a07811f5a9a76          # TheoBrigitte/freqtrade (strategies + his dry runs)
  SHAH_SHA: 65f9f4c02e6cdc15a6a7ae85356529134bb965c5          # ShahAnuj2610/my-freqtrade
  DJIENNE_SHA: 31ba6ef01a27d119a00b3544125d0cc73d711a13       # djienne/YOUTUBE_STRATEGIES_FREQTRADE
  BUSTILLO_SHA: 4734aa619a460347f22607de9e3018ec24a7890d      # bustillo/freqtrade-strategies
  BASKET: BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,LTCUSDT,LINKUSDT,AVAXUSDT,DOTUSDT,TRXUSDT,ATOMUSDT

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # rounds 1-3 parts (ft5m, nfi_btc, nfi_eth, nfi_basket, nfi_oos_x4/x5/x6, ports2, meta, packs, ports3,
        # cluc_basket) are done and their exports kept in the release; add them back here to rerun one
        part: [r4_s1, r4_s2, r4_s3, r4_s4, r4_s5, r4_s6, r4_s7, r4_f, r4_lev, r4_check]
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: research/bot_edge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/bot_edge/requirements.txt
      - run: pip install -r requirements.txt

      - name: Strategy repos (pinned commits)
        run: |
          git clone -q https://github.com/freqtrade/freqtrade-strategies /tmp/fts && git -C /tmp/fts checkout -q "$FT_STRATS_SHA"
          git clone -q --filter=blob:none https://github.com/iterativv/NostalgiaForInfinity /tmp/nfi && git -C /tmp/nfi checkout -q "$NFI_SHA"
          mkdir -p /tmp/strats /tmp/strats_fut /tmp/nfi_s
          find /tmp/fts/user_data/strategies -name '*.py' -not -path '*futures*' -not -path '*lookahead_bias*' -exec cp {} /tmp/strats/ \;
          for f in /tmp/fts/user_data/strategies/lookahead_bias/*.py; do cp "$f" "/tmp/strats/LA_$(basename "$f")"; done
          cp /tmp/fts/user_data/strategies/futures/*.py /tmp/strats_fut/
          cp /tmp/nfi/NostalgiaForInfinityX7.py /tmp/nfi_s/
          # out-of-sample: each NFI generation exactly as it stood on a past date, tested only on later data
          mkdir -p /tmp/nfi_x4 /tmp/nfi_x5 /tmp/nfi_x6
          git -C /tmp/nfi show 418bfa6f03fa2b3d4c4c15c3a8044e5ef80592bd:NostalgiaForInfinityX4.py > /tmp/nfi_x4/NostalgiaForInfinityX4.py  # 2023-12-30
          git -C /tmp/nfi show e5b345a8d81e4559572cc0806d86d9178d0719e1:NostalgiaForInfinityX5.py > /tmp/nfi_x5/NostalgiaForInfinityX5.py  # 2024-12-30
          git -C /tmp/nfi show cd6e1b7e891a9a83def47b884f1ec15e6afd4098:NostalgiaForInfinityX6.py > /tmp/nfi_x6/NostalgiaForInfinityX6.py  # 2025-07-01
          sed -i "s/^from numpy.lib import math/import math/" /tmp/strats/*.py /tmp/strats_fut/*.py   # numpy 2 removed numpy.lib.math
          # round 3 packs: ssssi (ClucHAnix, E0V1E, archive) and nateemma SimpleStrategies (needs its framework folders)
          if [ "${{ matrix.part }}" = cluc_basket ]; then   # out-of-sample check of the one pack strategy that passed
            git clone -q https://github.com/ssssi/freqtrade_strs /tmp/ssssi && git -C /tmp/ssssi checkout -q "$SSSSI_SHA"
            mkdir -p /tmp/cluc && cp /tmp/ssssi/ClucHAnix/ClucHAnix_5m.py /tmp/cluc/
          fi
          case "${{ matrix.part }}" in r4_*)
            mkdir -p /tmp/r4src && cd /tmp/r4src
            for r in TheoBrigitte/freqtrade:$THEO_SHA ShahAnuj2610/my-freqtrade:$SHAH_SHA \
                     djienne/YOUTUBE_STRATEGIES_FREQTRADE:$DJIENNE_SHA bustillo/freqtrade-strategies:$BUSTILLO_SHA; do
              n=${r%%:*}; d=$(echo "$n" | tr / _); git clone -q --filter=blob:none "https://github.com/$n" "$d" && git -C "$d" checkout -q "${r##*:}"; done
            cd "$GITHUB_WORKSPACE/research/bot_edge"
            python r4_prep.py /tmp/r4 results/results.csv /tmp/r4src/TheoBrigitte_freqtrade /tmp/r4src/ShahAnuj2610_my-freqtrade \
              /tmp/r4src/djienne_YOUTUBE_STRATEGIES_FREQTRADE /tmp/r4src/bustillo_freqtrade-strategies
            git clone -q https://github.com/ssssi/freqtrade_strs /tmp/ssssi && git -C /tmp/ssssi checkout -q "$SSSSI_SHA"
            mkdir -p /tmp/lev && python lev/make_lev.py /tmp/ssssi/ClucHAnix/ClucHAnix_5m.py /tmp/lev
            python r4_fix.py /tmp/r4 /tmp/r4fix
            mkdir -p /tmp/mm && cp /tmp/r4/*/Market_Making.py /tmp/mm/ ;;
          esac
          if [ "${{ matrix.part }}" = packs ]; then
            git clone -q https://github.com/ssssi/freqtrade_strs /tmp/ssssi && git -C /tmp/ssssi checkout -q "$SSSSI_SHA"
            git clone -q --filter=blob:none https://github.com/nateemma/strategies /tmp/nate && git -C /tmp/nate checkout -q "$NATE_SHA"
            mkdir -p /tmp/packs/s_ssssi /tmp/packs/s_nate
            S=/tmp/ssssi; cp $S/binance/Archive/{BBMod,BinHV27F,BinHV27_short,ConsensusShort,HourBasedStrategy}.py \
              $S/ClucHAnix/ClucHAnix.py $S/ClucHAnix/ClucHAnix_5m.py $S/binance/dry_run/buy1_and_buynew/E0V1E.py \
              $S/binance/dry_run/E0V1EN.py /tmp/packs/s_ssssi/
            cp /tmp/nate/SimpleStrategies/*.py /tmp/nate/Reversion/OversoldReversion.py /tmp/packs/s_nate/
            cp -r /tmp/nate/utils /tmp/packs/s_nate/
            for d in Framework Anomaly Discriminators GANs MLX NNMT NNNC NNPredict NNWavelet Predictors TSPredict regime Sklearn; do
              ln -sfn /tmp/nate/$d /tmp/packs/$d; done
          fi

      - name: Binance 5-minute bars
        run: |
          case "${{ matrix.part }}" in
            nfi_basket|nfi_oos_*|cluc_basket) python prep_data.py binance /tmp/data "$BASKET" 2022-09 ;;
            meta|packs) python prep_data.py binance /tmp/data BTCUSDT,ETHUSDT 2018-10 ;;
            r4_lev) python prep_data.py binance /tmp/data "$BASKET" 2022-09 ;;
            r4_check) python prep_data.py binance /tmp/data BTCUSDT 2020-09
                      python prep_data.py binance1m /tmp/data BTCUSDT 2020-12 ;;
            r4_*) python prep_data.py binance /tmp/data BTCUSDT 2020-09 ;;
            ports2|ports3) python prep_data.py binance /tmp/data BTCUSDT,ETHUSDT 2018-10
                    python prep_data.py binance /tmp/bdata "$BASKET" 2022-09 ;;
            *) python prep_data.py binance /tmp/data BTCUSDT,ETHUSDT 2018-10 ;;
          esac

      - name: Earlier exports (a re-run only scores what is already done)
        run: |
          mkdir -p /tmp/out
          if gh release download bot-edge-results --repo "$GITHUB_REPOSITORY" --pattern "bot-edge-${{ matrix.part }}.tar.gz*" --dir /tmp/prev; then
            cat $(ls /tmp/prev/bot-edge-${{ matrix.part }}.tar.gz* | sort) | tar xz -C /tmp/out && rm -f /tmp/out/out.log; fi
          ls /tmp/out | head

      - name: Backtest
        run: |
          set -o pipefail
          case "${{ matrix.part }}" in
            ft5m)
              python ft_batch.py --strategies /tmp/strats --assets BTC,ETH --fee 0.001 --tfs 5m,15m,30m --fallback 5m \
                --only-native 1m,5m,15m,30m --datadir /tmp/data --out /tmp/out | tee /tmp/out.log
              python ft_batch.py --strategies /tmp/strats /tmp/strats_fut --futures --assets BTC,ETH --fee 0.0005 \
                --tfs 5m,15m,30m --fallback 5m --only-native 1m,5m,15m,30m --datadir /tmp/data --out /tmp/out | tee -a /tmp/out.log ;;
            nfi_btc)
              python ft_batch.py --strategies /tmp/nfi_s --assets BTC --fee 0.001 --tfs 5m --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            nfi_eth)
              python ft_batch.py --strategies /tmp/nfi_s --assets ETH --fee 0.001 --tfs 5m --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            nfi_basket)
              B=$(echo "$BASKET" | sed 's/USDT//g; s/,/+/g')
              python ft_batch.py --strategies /tmp/nfi_s --assets "$B" --fee 0.001 --tfs 5m --max-open-trades 6 \
                --timerange 20230101- --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            nfi_oos_*)
              v=${{ matrix.part }}; v=${v#nfi_oos_}
              case $v in x4) T=20240101-;; x5) T=20250101-;; x6) T=20250701-;; esac
              B=$(echo "$BASKET" | sed 's/USDT//g; s/,/+/g')
              python ft_batch.py --strategies /tmp/nfi_$v --assets "$B" --fee 0.001 --tfs 5m --max-open-trades 6 \
                --timerange "$T" --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            ports2)
              [ -f /tmp/out/rows_ports2.csv ] && exit 0
              pip install -q smartmoneyconcepts==0.0.27
              python run_ports2.py ci /tmp/data /tmp/bdata /tmp/out/rows_ports2.csv | tee /tmp/out.log ;;
            meta)
              [ -f /tmp/out/rows_meta.csv ] || python meta.py ci /tmp/data /tmp/out/rows_meta.csv | tee /tmp/out.log ;;
            packs)
              # nateemma's utils import tensorflow at module level; the indicator strategies never use it (stubs/)
              pip install -q PyWavelets pandas-ta finta pycoingecko
              export PYTHONPATH=$PWD/stubs
              python ft_batch.py --strategies /tmp/packs/s_ssssi /tmp/packs/s_nate --assets BTC,ETH --fee 0.001 --tfs 5m,15m,30m \
                --fallback 5m --only-native 1m,5m,15m,30m --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            cluc_basket)
              # ClucHAnix_5m last changed 2022-12-08 (ssssi history), so 2023+ is out of sample; 12 coins, 6 slots
              B=$(echo "$BASKET" | sed 's/USDT//g; s/,/+/g')
              python ft_batch.py --strategies /tmp/cluc --assets "$B" --fee 0.001 --tfs 5m --max-open-trades 6 \
                --timerange 20230101- --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            r4_s*)
              # BTC only and from 2021, so ~280 strategies fit in seven parallel jobs; own timeframe when we have its bars
              pip install -q PyWavelets pandas-ta finta pmdarima scikit-optimize optuna || true
              export PYTHONPATH=$PWD/stubs; P=${{ matrix.part }}
              python ft_batch.py --strategies /tmp/r4/${P#r4_} --assets BTC --fee 0.001 --tfs 5m,15m,30m,1h,4h,1d \
                --fallback 5m --timerange 20210101- --run-timeout 1200 --mem-gb 9 --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            r4_f)
              # strategies that short, run as perpetual futures at the leverage each one asks for (up to 20x), 5 bp
              pip install -q PyWavelets pandas-ta finta pmdarima scikit-optimize optuna || true
              export PYTHONPATH=$PWD/stubs FT_MAXLEV=20
              python ft_batch.py --strategies /tmp/r4/f --futures --assets BTC --fee 0.0005 --tfs 5m,15m,30m,1h,4h,1d \
                --fallback 5m --timerange 20210101- --run-timeout 1200 --mem-gb 9 --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            r4_lev)
              # the one strategy that passed, leveraged 2x/3x/5x as perpetual futures, 12 coins, 6 slots, 2023+
              B=$(echo "$BASKET" | sed 's/USDT//g; s/,/+/g')
              FT_MAXLEV=10 python ft_batch.py --strategies /tmp/lev --futures --assets "$B" --fee 0.0005 --tfs 5m --max-open-trades 6 \
                --timerange 20230101- --datadir /tmp/data --out /tmp/out | tee /tmp/out.log ;;
            r4_check)
              # the rows that looked like 16-26% a month: NOTankAi with its 5-bar look-ahead removed (r4_fix.py), and
              # Market_Making's limit-order fills checked on 1-minute bars instead of assumed inside each 5-minute bar
              pip install -q PyWavelets pandas-ta finta pmdarima scikit-optimize optuna || true
              export PYTHONPATH=$PWD/stubs
              python ft_batch.py --strategies /tmp/r4fix --assets BTC --fee 0.001 --tfs 5m,15m,30m,1h,4h,1d \
                --fallback 5m --timerange 20210101- --run-timeout 1800 --mem-gb 9 --datadir /tmp/data --out /tmp/out | tee /tmp/out.log
              python ft_batch.py --strategies /tmp/mm --assets BTC --fee 0.001 --tfs 5m --fallback 5m --detail 1m --tag _d1m \
                --timerange 20210101- --run-timeout 5400 --mem-gb 12 --datadir /tmp/data --out /tmp/out | tee -a /tmp/out.log
              # and at its own 1-minute timeframe (2024+ to fit the runner)
              python ft_batch.py --strategies /tmp/mm --assets BTC --fee 0.001 --tfs 1m --tag _1m \
                --timerange 20240101- --run-timeout 5400 --mem-gb 12 --datadir /tmp/data --out /tmp/out | tee -a /tmp/out.log ;;
            ports3)
              [ -f /tmp/out/rows_ports3.csv ] || python run_ports3.py ci /tmp/data /tmp/out/rows_ports3.csv /tmp/bdata | tee /tmp/out.log ;;
          esac
          grep -h FAIL /tmp/out.log || true

      - name: Score (random-timing test, costs, halves, alpha vs holding)
        if: always()
        run: |
          case "${{ matrix.part }}" in ports2|meta|ports3) exit 0;; esac
          python ft_score.py /tmp/data /tmp/out/rows_${{ matrix.part }}.csv /tmp/out | tail -60
          i=0; for z in /tmp/out/res_BASKET*.zip; do [ -f "$z" ] && i=$((i+1)) && python basket_score.py /tmp/data "$z" /tmp/out/rows_basket_$i.csv; done; true

      - name: Upload trade exports
        if: always()
        run: |
          cp /tmp/out.log /tmp/out/out.log 2>/dev/null || true
          # never replace the saved exports with nothing (a failed prep once deleted them)
          [ -d /tmp/out ] && ls /tmp/out/*.done >/dev/null 2>&1 || { echo "no exports, release left as it is"; exit 1; }
          cd /tmp/out && tar czf /tmp/bot-edge-${{ matrix.part }}.tar.gz $(ls *.zip *.done *.csv out.log 2>/dev/null)
          gh release view bot-edge-results --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create bot-edge-results --repo "$GITHUB_REPOSITORY" --title "Bot edge test results" \
              --notes "freqtrade trade exports from .github/workflows/bot-edge.yml (research only)." --prerelease
          # release assets must be under 2 GiB: big exports go up in 1.9 GB parts (.tar.gz.part-aa, -ab, ...)
          F=/tmp/bot-edge-${{ matrix.part }}.tar.gz
          if [ "$(stat -c %s "$F")" -gt 1900000000 ]; then split -b 1900m "$F" "$F.part-"; rm "$F"; fi
          for old in $(gh release view bot-edge-results --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep "^bot-edge-${{ matrix.part }}\.tar\.gz"); do
            [ -e "/tmp/$old" ] || gh release delete-asset bot-edge-results "$old" --repo "$GITHUB_REPOSITORY" -y || true; done
          for f in $F*; do
            for i in 1 2 3 4; do   # the API sometimes times out; retry with backoff
              gh release upload bot-edge-results "$f" --repo "$GITHUB_REPOSITORY" --clobber && break
              [ $i = 4 ] && exit 1; sleep $((i * 20)); done
          done
