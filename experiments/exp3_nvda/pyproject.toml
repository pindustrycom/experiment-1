[project]
name = "exp3-nvda"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 210
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["exp3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
