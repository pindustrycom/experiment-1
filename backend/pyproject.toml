[project]
name = "splittability-monitor-backend"
version = "0.1.0"
description = "Splittability Monitor: pairs-divergence research platform (API + worker)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "anthropic>=1.14",
  "httpx>=0.27",
  "feedparser>=6.0",
  "apscheduler>=3.10,<4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "reportlab>=4.2",
  "python-dateutil>=2.9",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.ruff]
line-length = 210
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in defaults by design

[tool.ruff.lint.per-file-ignores]
"app/services/demo_service.py" = ["E501"]  # long simulated article texts
"app/services/reports.py" = ["E501"]
"app/static_site.py" = ["E501"]  # inline HTML templates
